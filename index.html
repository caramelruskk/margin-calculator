<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마진 계산기</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Aptos', 'Gill Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
        }

        .container {
            background: white;
            border-radius: 0;
            box-shadow: none;
            border: 1px solid #e8e8e8;
            max-width: 1000px;
            width: 100%;
            overflow: hidden;
        }

        .header {
            background: #ffffff;
            color: #000;
            padding: 80px 60px;
            text-align: left;
            border-bottom: 1px solid #e8e8e8;
        }

        .header h1 {
            font-size: 52px;
            font-weight: 300;
            margin-bottom: 16px;
            letter-spacing: -2px;
            font-family: 'Aptos', 'Georgia', serif;
        }

        .header p {
            font-size: 15px;
            opacity: 0.6;
            font-weight: 300;
            letter-spacing: 0.3px;
        }

        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 80px;
            padding: 60px;
        }

        @media (max-width: 768px) {
            .content {
                grid-template-columns: 1fr;
                gap: 40px;
            }

            .header {
                padding: 50px 40px;
            }

            .header h1 {
                font-size: 36px;
            }
        }

        .section {
            display: flex;
            flex-direction: column;
            gap: 32px;
        }

        .section-title {
            font-size: 11px;
            font-weight: 400;
            color: #000;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            opacity: 0.5;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .input-label {
            font-size: 13px;
            font-weight: 400;
            color: #000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            letter-spacing: 0.2px;
        }

        .input-hint {
            font-size: 11px;
            color: #999;
            font-weight: 300;
        }

        input {
            padding: 16px 0;
            border: none;
            border-bottom: 1px solid #e8e8e8;
            border-radius: 0;
            font-size: 15px;
            transition: all 0.3s;
            font-family: inherit;
            background: transparent;
            font-weight: 300;
        }

        input:focus {
            outline: none;
            border-bottom-color: #000;
            box-shadow: none;
        }

        input::placeholder {
            color: #ccc;
            font-weight: 300;
        }

        .button-group {
            display: flex;
            gap: 16px;
            margin-top: 16px;
        }

        button {
            flex: 1;
            padding: 18px 0;
            font-size: 13px;
            font-weight: 400;
            border: none;
            border-radius: 0;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-calculate {
            background: #000;
            color: white;
            border: 1px solid #000;
        }

        .btn-calculate:hover {
            background: #1a1a1a;
            border-color: #1a1a1a;
        }

        .btn-calculate:active {
            opacity: 0.8;
        }

        .btn-reset {
            background: white;
            color: #000;
            border: 1px solid #000;
        }

        .btn-reset:hover {
            background: #f5f5f5;
        }

        .results {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .result-card {
            background: transparent;
            border: none;
            padding: 24px 0;
            border-bottom: 1px solid #e8e8e8;
            border-radius: 0;
            transition: all 0.3s;
        }

        .result-card.active {
            background: transparent;
            box-shadow: none;
        }

        .result-card:last-child {
            border-bottom: none;
        }

        .result-label {
            font-size: 11px;
            font-weight: 400;
            color: #000;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 12px;
            opacity: 0.5;
        }

        .result-value {
            font-size: 42px;
            font-weight: 300;
            color: #000;
            letter-spacing: -1px;
        }

        .result-value.positive {
            color: #2d5016;
        }

        .result-value.negative {
            color: #7a1d1d;
        }

        .result-card.margin {
            border-bottom-color: #e8e8e8;
        }

        .result-card.margin-rate {
            border-bottom-color: #e8e8e8;
        }

        .result-card.margin-rate .result-value {
            font-size: 42px;
        }

        .result-card.cost {
            border-bottom-color: #e8e8e8;
        }

        .breakdown {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid #f0f0f0;
        }

        .breakdown-item {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #666;
            padding: 8px 0;
            font-weight: 300;
        }

        .breakdown-item span:last-child {
            font-weight: 400;
            color: #000;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.3;
        }

        .empty-state-text {
            font-size: 14px;
            font-weight: 300;
            line-height: 1.6;
        }

        .footer {
            background: #fafafa;
            padding: 24px 60px;
            border-top: 1px solid #e8e8e8;
            font-size: 12px;
            color: #999;
            text-align: center;
            font-weight: 300;
            letter-spacing: 0.3px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Margin</h1>
            <p>Design Calculation Tool for Import Commerce</p>
        </div>

        <div class="content">
            <div class="section">
                <div class="section-title">구매 정보</div>

                <div class="input-group">
                    <label class="input-label">
                        <span>일본 원가 (¥)</span>
                        <span class="input-hint">JPY</span>
                    </label>
                    <input type="number" id="jpyPrice" placeholder="예: 1000" step="100">
                </div>

                <div class="input-group">
                    <label class="input-label">
                        <span>환율 (₩/¥)</span>
                        <span class="input-hint">1엔 = ?원</span>
                    </label>
                    <input type="number" id="exchangeRate" placeholder="예: 9.5" step="0.01" value="9.5">
                </div>

                <div class="input-group">
                    <label class="input-label">
                        <span>수량 (개)</span>
                        <span class="input-hint">몇 개를 팔 것인가?</span>
                    </label>
                    <input type="number" id="quantity" placeholder="예: 1" step="1" value="1" min="1">
                </div>

                <div class="input-group">
                    <label class="input-label">
                        <span>일본 배송비 (¥)</span>
                        <span class="input-hint">JPY</span>
                    </label>
                    <input type="number" id="jpyShipping" placeholder="예: 500" step="100" value="0">
                </div>

                <div class="section-title" style="margin-top: 30px;">판매 및 수수료</div>

                <div class="input-group">
                    <label class="input-label">
                        <span>한국 판매가 (₩)</span>
                        <span class="input-hint">KRW</span>
                    </label>
                    <input type="number" id="salePrice" placeholder="예: 15000" step="1000">
                </div>

                <div class="input-group">
                    <label class="input-label">
                        <span>수수료 (%)</span>
                        <span class="input-hint">판매가의 %</span>
                    </label>
                    <input type="number" id="fee" placeholder="예: 10" step="0.1" value="0" min="0" max="100">
                </div>

                <div class="input-group">
                    <label class="input-label">
                        <span>한국 배송비 (₩)</span>
                        <span class="input-hint">고객에게서 받는 배송료</span>
                    </label>
                    <input type="number" id="krwShipping" placeholder="예: 3000" step="100" value="0">
                </div>

                <div class="button-group">
                    <button class="btn-calculate" onclick="calculateMargin()">계산하기</button>
                    <button class="btn-reset" onclick="resetForm()">초기화</button>
                </div>
            </div>

            <div class="section">
                <div class="section-title">계산 결과</div>

                <div id="resultContainer" class="results">
                    <div class="empty-state">
                        <div class="empty-state-icon">📊</div>
                        <div class="empty-state-text">위의 정보를 입력하고<br>계산하기 버튼을 누르세요</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="footer">
            💡 팁: 수수료를 %로 입력하세요. 한국 배송비는 고객에게서 받는 배송료이므로 수익에 포함됩니다.
        </div>
    </div>

    <script>
        function calculateMargin() {
            const jpyPrice = parseFloat(document.getElementById('jpyPrice').value);
            const exchangeRate = parseFloat(document.getElementById('exchangeRate').value);
            const quantity = parseInt(document.getElementById('quantity').value) || 1;
            const jpyShipping = parseFloat(document.getElementById('jpyShipping').value) || 0;
            const salePrice = parseFloat(document.getElementById('salePrice').value);
            const feePercent = parseFloat(document.getElementById('fee').value) || 0;
            const krwShipping = parseFloat(document.getElementById('krwShipping').value) || 0;

            if (!jpyPrice || !exchangeRate || !salePrice || jpyPrice < 0 || exchangeRate < 0 || salePrice < 0 || quantity < 1) {
                alert('필수 항목을 올바르게 입력해주세요.');
                return;
            }

            const krwCostPerUnit = jpyPrice * exchangeRate;
            const krwJpyShippingPerUnit = jpyShipping * exchangeRate;
            
            const totalJpyCost = (krwCostPerUnit * quantity) + krwJpyShippingPerUnit;
            
            const feeAmount = salePrice * (feePercent / 100);
            const totalKrwCost = totalJpyCost + feeAmount;
            
            const totalRevenue = salePrice + krwShipping;
            
            const margin = totalRevenue - totalKrwCost;
            const marginRate = (margin / totalRevenue) * 100;

            displayResults(jpyPrice, krwCostPerUnit, krwJpyShippingPerUnit, totalJpyCost, feeAmount, totalKrwCost, salePrice, krwShipping, totalRevenue, margin, marginRate, quantity, feePercent);
        }

        function displayResults(jpyPrice, krwCostPerUnit, krwJpyShippingPerUnit, totalJpyCost, feeAmount, totalKrwCost, salePrice, krwShipping, totalRevenue, margin, marginRate, quantity, feePercent) {
            const resultContainer = document.getElementById('resultContainer');
            
            const marginClass = margin >= 0 ? 'positive' : 'negative';
            const marginRateClass = marginRate >= 0 ? 'positive' : 'negative';
            
            const marginSign = margin >= 0 ? '+' : '-';
            const marginRateSign = marginRate >= 0 ? '+' : '-';

            const marginPerUnit = margin / quantity;

            resultContainer.innerHTML = `
                <div class="result-card margin active">
                    <div class="result-label">마진 (₩)</div>
                    <div class="result-value ${marginClass}">
                        ${marginSign}${Math.abs(margin).toLocaleString('ko-KR', {maximumFractionDigits: 0})}
                    </div>
                    <div class="breakdown">
                        <div class="breakdown-item">
                            <span>단품당 마진</span>
                            <span>${(marginPerUnit >= 0 ? '+' : '-')}${Math.abs(marginPerUnit).toLocaleString('ko-KR', {maximumFractionDigits: 0})}</span>
                        </div>
                    </div>
                </div>

                <div class="result-card margin-rate active">
                    <div class="result-label">마진률 (%)</div>
                    <div class="result-value ${marginRateClass}">
                        ${marginRateSign}${Math.abs(marginRate).toFixed(2)}%
                    </div>
                </div>

                <div class="result-card cost">
                    <div class="result-label">비용 분석</div>
                    <div class="result-value">${totalKrwCost.toLocaleString('ko-KR', {maximumFractionDigits: 0})}</div>
                    <div class="breakdown">
                        <div class="breakdown-item">
                            <span>단품 원가 (₩)</span>
                            <span>${krwCostPerUnit.toLocaleString('ko-KR', {maximumFractionDigits: 0})}</span>
                        </div>
                        <div class="breakdown-item">
                            <span>수량</span>
                            <span>× ${quantity}개</span>
                        </div>
                        <div class="breakdown-item">
                            <span>= 원가 소계</span>
                            <span>${(krwCostPerUnit * quantity).toLocaleString('ko-KR', {maximumFractionDigits: 0})}</span>
                        </div>
                        <div class="breakdown-item">
                            <span>일본 배송비 (환전)</span>
                            <span>+${krwJpyShippingPerUnit.toLocaleString('ko-KR', {maximumFractionDigits: 0})}</span>
                        </div>
                        <div class="breakdown-item">
                            <span>일본 총 비용</span>
                            <span>${totalJpyCost.toLocaleString('ko-KR', {maximumFractionDigits: 0})}</span>
                        </div>
                        <div class="breakdown-item" style="border-top: 1px solid #f0f0f0; padding-top: 8px; margin-top: 8px;">
                            <span>수수료 (${feePercent.toFixed(1)}%)</span>
                            <span>+${feeAmount.toLocaleString('ko-KR', {maximumFractionDigits: 0})}</span>
                        </div>
                        <div class="breakdown-item" style="border-top: 1px solid #f0f0f0; padding-top: 8px; margin-top: 8px; font-weight: 600;">
                            <span>총 비용</span>
                            <span>${totalKrwCost.toLocaleString('ko-KR', {maximumFractionDigits: 0})}</span>
                        </div>
                    </div>
                </div>

                <div class="result-card cost">
                    <div class="result-label">수익 분석</div>
                    <div class="result-value">${totalRevenue.toLocaleString('ko-KR', {maximumFractionDigits: 0})}</div>
                    <div class="breakdown">
                        <div class="breakdown-item">
                            <span>판매가 (고정)</span>
                            <span>${salePrice.toLocaleString('ko-KR', {maximumFractionDigits: 0})}</span>
                        </div>
                        <div class="breakdown-item">
                            <span>한국 배송비 (고정)</span>
                            <span>+${krwShipping.toLocaleString('ko-KR', {maximumFractionDigits: 0})}</span>
                        </div>
                        <div class="breakdown-item" style="border-top: 1px solid #f0f0f0; padding-top: 8px; margin-top: 8px; font-weight: 600;">
                            <span>수익 (고정)</span>
                            <span>${totalRevenue.toLocaleString('ko-KR', {maximumFractionDigits: 0})}</span>
                        </div>
                    </div>
                </div>
            `;
        }

        function resetForm() {
            document.getElementById('jpyPrice').value = '';
            document.getElementById('exchangeRate').value = '9.5';
            document.getElementById('quantity').value = '1';
            document.getElementById('jpyShipping').value = '0';
            document.getElementById('krwShipping').value = '0';
            document.getElementById('salePrice').value = '';
            document.getElementById('fee').value = '0';
            
            const resultContainer = document.getElementById('resultContainer');
            resultContainer.innerHTML = `
                <div class="empty-state">
                    <div class="empty-state-icon">📊</div>
                    <div class="empty-state-text">위의 정보를 입력하고<br>계산하기 버튼을 누르세요</div>
                </div>
            `;
        }

        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                calculateMargin();
            }
        });
    </script>
</body>
</html>
